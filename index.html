<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚡ Darksider · हिंग्लिश में सीखें</title>
    <!-- PWA ke liye manifest -->
    <link rel="manifest" href="manifest.json" />
    <!-- iOS ke liye -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app" id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>⚡ Darksider <span>v2.0</span></h1>
            <div class="badge-voice">🇮🇳 Hinglish TTS</div>
        </div>

        <!-- TOPIC CARD -->
        <div class="topic-card" id="topicCard">
            <h2 id="topicTitle">लोड हो रहा...</h2>
            <p id="topicContent">कंटेंट लोड हो रहा है...</p>

            <!-- VOICE CONTROLS -->
            <div class="voice-controls">
                <button class="voice-btn-main" id="voiceBtn">
                    <span>🔊</span> <span id="voiceLabel">सुनें</span>
                </button>
                <div class="voice-options">
                    <label>🗣️ आवाज़ <select id="voiceSelect"></select></label>
                    <label>स्पीड <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1" />
                        <span class="speed-val" id="speedDisplay">1.0x</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- QUIZ SECTION -->
        <div class="quiz-section" id="quizSection">
            <div class="quiz-header">
                <h3>🧠 क्विक क्विज़</h3>
                <span class="progress-badge" id="progressBadge">1 / 3</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div id="quizContainer">
                <!-- Dynamic -->
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
