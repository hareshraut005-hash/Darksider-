<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚡ Darksider · Learn with Voice</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app" id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>⚡ Darksider <span>v2.0</span></h1>
            <div class="lang-selector">
                <label for="langSelect">🌐 Language</label>
                <select id="langSelect">
                    <option value="en">🇬🇧 English</option>
                    <option value="hi">🇮🇳 हिंदी</option>
                </select>
            </div>
        </div>

        <!-- TOPIC CARD -->
        <div class="topic-card" id="topicCard">
            <h2 id="topicTitle">Loading...</h2>
            <p id="topicContent">Loading content...</p>

            <!-- VOICE CONTROLS -->
            <div class="voice-controls">
                <button class="voice-btn-main" id="voiceBtn">
                    <span>🔊</span> <span id="voiceLabel">Listen</span>
                </button>
                <div class="voice-options">
                    <label>🗣️ Voice <select id="voiceSelect"></select></label>
                    <label>Speed <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1" />
                        <span class="speed-val" id="speedDisplay">1.0x</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- QUIZ SECTION -->
        <div class="quiz-section" id="quizSection">
            <div class="quiz-header">
                <h3 id="quizTitle">🧠 Quick Quiz</h3>
                <span class="progress-badge" id="progressBadge">1 / 3</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div id="quizContainer">
                <!-- Dynamic -->
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
